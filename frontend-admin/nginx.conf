server {
    listen 5174;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page application fallback: unknown paths serve index.html
    # so that client-side routing works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the entry point so browsers always fetch the latest
    # hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
